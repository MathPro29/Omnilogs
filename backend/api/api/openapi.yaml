components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ElasticPolicyId:
      name: elasticPolicyId
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    FeatureId:
      name: featureId
      in: path
      required: true
      schema:
        type: integer
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: integer
    ScopeId:
      name: scopeId
      in: path
      required: true
      schema:
        type: integer
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          nullable: true
    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, confirm_password]
      properties:
        username:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
          nullable: true
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password, confirm_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
    GiveAdminAccessRequest:
      type: object
      required: [id, role_id]
      properties:
        id:
          type: integer
        role_id:
          type: integer
          enum: [1, 2, 3, 4]
    GiveAdminAccessResponse:
      type: object
      properties:
        user_id:
          type: integer
        storage_table:
          type: string
          example: platform_memberships
        previous_role_id:
          type: integer
        previous_role_code:
          type: string
        new_role_id:
          type: integer
        new_role_code:
          type: string
        message:
          type: string
    CreateProductRequest:
      type: object
      required: [product_name, product_code]
      properties:
        product_name:
          type: string
        product_code:
          type: string
        environments:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
                nullable: true
              environment_code:
                type: string
              environment_name:
                type: string
    UpdateProductRequest:
      type: object
      properties:
        product_name:
          type: string
        product_code:
          type: string
        is_active:
          type: boolean
    CreateProductRoleRequest:
      type: object
      required: [role_code, role_name, permissions]
      properties:
        product_id:
          type: integer
          nullable: true
        template_id:
          type: integer
          nullable: true
        role_code:
          type: string
        role_name:
          type: string
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RolePermissionAssignment'
    UpdateRoleRequest:
      type: object
      properties:
        role_name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RolePermissionAssignment'
        is_active:
          type: boolean
    RolePermissionAssignment:
      type: object
      required: [resource_type, action]
      properties:
        resource_type:
          type: string
          enum: [PRODUCT, PROJECT, FEATURE, CATEGORY, ROLE, ACCESS, USER, API_KEY, ENVIRONMENT, LOG]
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, GRANT, REVOKE, EXPORT, VIEW_SENSITIVE]
    CreateEnvironmentRequest:
      type: object
      required: [environment_code, environment_name]
      properties:
        product_id:
          type: integer
          nullable: true
        environment_code:
          type: string
        environment_name:
          type: string
    UpdateEnvironmentRequest:
      type: object
      properties:
        environment_name:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        project_name:
          type: string
        is_active:
          type: boolean
    UpdateProjectFeatureRequest:
      type: object
      properties:
        parent_id:
          type: integer
          nullable: true
        category_type:
          type: string
          nullable: true
        category_name:
          type: string
        is_active:
          type: boolean
    CreateMembershipScopeRequest:
      type: object
      required: [scope_level]
      properties:
        project_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          nullable: true
        scope_level:
          type: string
          enum: [PRODUCT, PROJECT, CATEGORY]
    CreateProductMembershipRequest:
      type: object
      required: [user_id, role_id]
      properties:
        user_id:
          type: integer
        product_id:
          type: integer
          nullable: true
        role_id:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
    CreateBulkProductMembershipRequest:
      type: object
      required: [memberships]
      properties:
        memberships:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateProductMembershipRequest'
    UpdateProductMembershipRequest:
      type: object
      properties:
        role_id:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
    UpdateMembershipScopeRequest:
      type: object
      required: [scope_level]
      properties:
        project_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          nullable: true
        scope_level:
          type: string
          enum: [PRODUCT, PROJECT, CATEGORY]
    CreatePermissionRuleRequest:
      type: object
      required: [user_id, resource_type, action, effect, scope_level]
      properties:
        user_id:
          type: integer
        product_id:
          type: integer
          nullable: true
        role_id:
          type: integer
          nullable: true
        project_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          nullable: true
        resource_type:
          type: string
          enum: [PRODUCT, PROJECT, FEATURE, CATEGORY, ROLE, ACCESS, USER, API_KEY, ENVIRONMENT, LOG]
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, GRANT, REVOKE, EXPORT, VIEW_SENSITIVE]
        effect:
          type: string
          enum: [ALLOW, DENY]
        scope_level:
          type: string
          enum: [GLOBAL, PRODUCT, PROJECT, CATEGORY]
        expires_at:
          type: string
          format: date-time
          nullable: true
    UpdatePermissionRuleRequest:
      type: object
      properties:
        effect:
          type: string
          enum: [ALLOW, DENY]
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
    PermissionCheckRequest:
      type: object
      required: [resource_type, action]
      properties:
        product_id:
          type: integer
          nullable: true
        project_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          nullable: true
        resource_type:
          type: string
        action:
          type: string
    CreateSensitiveLogAccessRequest:
      type: object
      required: [product_id, reason]
      properties:
        product_id:
          type: integer
        log_id:
          type: string
          format: uuid
          nullable: true
        field_definition_id:
          type: integer
          nullable: true
        secret_id:
          type: string
          format: uuid
          nullable: true
        field_path:
          type: string
          nullable: true
        reason:
          type: string
    ReviewSensitiveLogAccessRequest:
      type: object
      required: [approval_status]
      properties:
        approval_status:
          type: string
          enum: [APPROVED, REJECTED]
        expires_at:
          type: string
          format: date-time
          nullable: true
    RevealSensitiveLogRequest:
      type: object
      required: [request_id, password]
      properties:
        request_id:
          type: string
          format: uuid
        password:
          type: string
    SensitiveLogAccessRequestResponse:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        user_id:
          type: integer
        product_id:
          type: integer
        log_id:
          type: string
          format: uuid
          nullable: true
        field_definition_id:
          type: integer
          nullable: true
        secret_id:
          type: string
          format: uuid
          nullable: true
        field_path:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        approval_status:
          type: string
        approved_by:
          type: integer
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    RevealedSensitiveLogResponse:
      type: object
      properties:
        secret_id:
          type: string
          format: uuid
        field_key:
          type: string
        field_path:
          type: string
        value:
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    SensitiveLogAccessHistoryResponse:
      type: object
      properties:
        access_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
          nullable: true
        product_id:
          type: integer
          nullable: true
        user_id:
          type: integer
        project_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          nullable: true
        log_id:
          type: string
          format: uuid
          nullable: true
        field_path:
          type: string
          nullable: true
        access_reason:
          type: string
          nullable: true
        auth_method:
          type: string
          nullable: true
        access_status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    CreateElasticIndexPolicyRequest:
      type: object
      required: [product_id, index_prefix, rollover_type]
      properties:
        product_id:
          type: integer
        environment_id:
          type: integer
          nullable: true
        index_prefix:
          type: string
        index_pattern:
          type: string
          nullable: true
        write_alias:
