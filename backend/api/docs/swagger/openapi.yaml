          type: string
          format: uuid
        user_id:
          type: integer
        product_id:
          type: integer
        log_id:
          type: string
          format: uuid
          nullable: true
        field_definition_id:
          type: integer
          nullable: true
        secret_id:
          type: string
          format: uuid
          nullable: true
        field_path:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        approval_status:
          type: string
        approved_by:
          type: integer
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    RevealedSensitiveLogResponse:
