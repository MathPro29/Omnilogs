services:
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - ./api/.env copy
    environment:
      DB_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NATS_URL: nats://nats:4222
      SWAGGER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nats:
        condition: service_started
    restart: "no"

  seed:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: seed
    env_file:
      - ./api/.env copy
    environment:
      DB_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NATS_URL: nats://nats:4222
      SWAGGER_ENABLED: "false"
    command: ["omnilogs-seed", "-email", "${SEED_EMAIL:-godmode@godmail.com}", "-password", "${SEED_PASSWORD:-OhMyGod999@!}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: api
    env_file:
      - ./api/.env copy
    environment:
      DB_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NATS_URL: nats://nats:4222
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-2910}:${API_PORT:-2910}"
    volumes:
      # Archive files are created by the worker and restored by the API.
      - archive_data:/app/data/archives
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${API_PORT:-2910}/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    env_file:
      - ./api/.env copy
    environment:
      DB_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NATS_URL: nats://nats:4222
      APP_PORT: 2911
      SWAGGER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      # Keep the archive storage shared with the API container.
      - archive_data:/app/data/archives
    restart: on-failure

  retention-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: retention-worker
    env_file:
      - ./api/.env copy
    environment:
      DB_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NATS_URL: nats://nats:4222
      APP_PORT: 2912
      SWAGGER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - archive_data:/app/data/archives
    restart: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-omnilogs}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5499}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnilogs"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    hostname: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  elastic_data:
  nats_data:
  archive_data:
